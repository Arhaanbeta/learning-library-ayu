<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Arrows &amp; Machines</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="An interactive journey into vectors and matrices for young learners: arrows, machines, moving space and maps.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Lexend:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap">
<style>
/* ============================================================
   Arrows & Machines
   Layout concept: a lab notebook on graph paper. A left rail lists the
   journey; each lesson pairs a short story column with a live grid stage.
   ============================================================ */
:root {
  /* paper and ink */
  --paper: #f2f5fa;
  --sheet: #ffffff;
  --sheet-2: #edf1f7;
  --ink: #12203b;
  --ink-2: #435069;
  --ink-3: #66728a;
  --rule: #d8e0eb;
  --grid: rgba(44, 94, 172, 0.06);
  --shade: rgba(18, 32, 59, 0.14);
  /* the maths colours: each one means the same thing on every page */
  --c1: #087f57;      /* green: column 1, the arrow (1, 0) */
  --c2: #c24e06;      /* orange: column 2, the arrow (0, 1) */
  --vec: #6a3fe0;     /* violet: your arrow */
  --vec2: #0a7bbd;    /* sky: a second arrow */
  --gold: #9c6b00;    /* gold: answers and area */
  --across: #1e6bd0;  /* cos */
  --up: #c4346f;      /* sin */
  /* interface */
  --btn: #12203b;
  --btn-ink: #ffffff;
  --mark: #fff0a0;
  --mark-ink: #3b3000;
  --ok: #157a39;
  --ok-bg: #e2f5e8;
  --bad: #c22b2b;
  --bad-bg: #fdeaea;
  --focus: #6a3fe0;
  /* the drawing grid */
  --plane: #ffffff;
  --plane-grid: #e5eaf2;
  --plane-axis: #56627b;
  --plane-label: #66728a;
  --tgrid: rgba(30, 107, 208, 0.40);
  --tgrid-axis: rgba(30, 107, 208, 0.85);
  /* the little house */
  --wall: #fde4c4;
  --roof: #b04f28;
  --chimney: #774532;
  --door: #86563a;
  --window: #a6d4ff;
  --house-line: #3a2a22;
  /* type */
  --display: 'Unbounded', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
  --body: 'Lexend', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0c1322;
    --sheet: #131c30;
    --sheet-2: #1a2540;
    --ink: #e6ecf7;
    --ink-2: #aab6cc;
    --ink-3: #8b98b0;
    --rule: #26324d;
    --grid: rgba(130, 180, 255, 0.05);
    --shade: rgba(0, 0, 0, 0.5);
    --c1: #34d399;
    --c2: #fb923c;
    --vec: #a78bfa;
    --vec2: #38bdf8;
    --gold: #fbbf24;
    --across: #60a5fa;
    --up: #f472b6;
    --btn: #e6ecf7;
    --btn-ink: #0c1322;
    --mark: #4b4010;
    --mark-ink: #fdf4c9;
    --ok: #4ade80;
    --ok-bg: #12301f;
    --bad: #f87171;
    --bad-bg: #3a1719;
    --focus: #c4b5fd;
    --plane: #0f182b;
    --plane-grid: #1d2843;
    --plane-axis: #a9b4cc;
    --plane-label: #8794ad;
    --tgrid: rgba(96, 165, 250, 0.42);
    --tgrid-axis: rgba(147, 197, 253, 0.95);
    --wall: #3b3354;
    --roof: #d0714a;
    --chimney: #9c6a51;
    --door: #a77851;
    --window: #4f7fae;
    --house-line: #ece5f7;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --paper: #0c1322;
    --sheet: #131c30;
    --sheet-2: #1a2540;
    --ink: #e6ecf7;
    --ink-2: #aab6cc;
    --ink-3: #8b98b0;
    --rule: #26324d;
    --grid: rgba(130, 180, 255, 0.05);
    --shade: rgba(0, 0, 0, 0.5);
    --c1: #34d399;
    --c2: #fb923c;
    --vec: #a78bfa;
    --vec2: #38bdf8;
    --gold: #fbbf24;
    --across: #60a5fa;
    --up: #f472b6;
    --btn: #e6ecf7;
    --btn-ink: #0c1322;
    --mark: #4b4010;
    --mark-ink: #fdf4c9;
    --ok: #4ade80;
    --ok-bg: #12301f;
    --bad: #f87171;
    --bad-bg: #3a1719;
    --focus: #c4b5fd;
    --plane: #0f182b;
    --plane-grid: #1d2843;
    --plane-axis: #a9b4cc;
    --plane-label: #8794ad;
    --tgrid: rgba(96, 165, 250, 0.42);
    --tgrid-axis: rgba(147, 197, 253, 0.95);
    --wall: #3b3354;
    --roof: #d0714a;
    --chimney: #9c6a51;
    --door: #a77851;
    --window: #4f7fae;
    --house-line: #ece5f7;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 80px; }
body {
  margin: 0;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 60;
  background: var(--paper);
}
img, canvas { max-width: 100%; }
a { color: inherit; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.emo { font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif; font-weight: 400; font-style: normal; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- app shell ---------- */
.app { display: grid; grid-template-columns: 292px minmax(0, 1fr); min-height: 100vh; }
.main { min-width: 0; }
.rail {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  align-self: start;
  height: calc(100vh - env(safe-area-inset-top, 0px));
  overflow-y: auto;
  overscroll-behavior: contain;
  background: var(--sheet);
  border-right: 1px solid var(--rule);
  padding-block: 20px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: 14px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  z-index: 40;
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; padding: 0 6px; }
.brand-mark { width: 38px; height: 38px; flex: none; display: block; }
.brand-name { font-family: var(--display); font-weight: 700; font-size: 15px; line-height: 1.15; letter-spacing: -0.01em; }
.brand-sub { display: block; font-family: var(--body); font-weight: 500; font-size: 12px; color: var(--ink-3); letter-spacing: 0; }
.rail-nav { display: grid; gap: 16px; }
.rail-part { display: grid; gap: 4px; }
.rail-ptitle { display: grid; gap: 1px; padding: 0 8px 2px; }
.rail-ptitle .pnum { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.rail-ptitle .pname { font-weight: 600; font-size: 14px; line-height: 1.3; }
.rail-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.rail-list a, .rail-home {
  display: grid; grid-template-columns: 24px minmax(0, 1fr); align-items: center; gap: 9px;
  padding: 6px 8px; border-radius: 9px; text-decoration: none;
  font-size: 14.5px; line-height: 1.3; color: var(--ink-2);
}
.rail-list a:hover, .rail-home:hover { background: var(--sheet-2); color: var(--ink); }
.rail-list a[aria-current="page"], .rail-home[aria-current="page"] { background: var(--btn); color: var(--btn-ink); }
.rnum {
  width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--mono); font-size: 11px; font-weight: 700; border: 1.5px solid currentColor;
}
.rail-list a.done .rnum { background: var(--ok); border-color: var(--ok); color: var(--sheet); }
.rail-foot { margin-top: auto; display: grid; gap: 10px; padding: 0 6px; }
.meter { height: 8px; border-radius: 99px; background: var(--sheet-2); overflow: hidden; }
.meter > span { display: block; height: 100%; width: 0; background: var(--ok); border-radius: inherit; transition: width .4s ease; }
.meter-txt { font-size: 13px; color: var(--ink-3); }

.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 10px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--rule);
}
.topbar .where { flex: 1; min-width: 0; font-size: 14px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .where b { color: var(--ink); font-weight: 600; }
.iconbtn {
  display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px;
  border-radius: 10px; border: 1.5px solid var(--rule); background: var(--sheet);
  cursor: pointer; font-size: 14px; font-weight: 600; white-space: nowrap;
}
.iconbtn:hover { border-color: var(--ink-3); }
.iconbtn svg { width: 18px; height: 18px; }
.menu-btn { display: none; }
.scrim { display: none; }
@media (max-width: 1080px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail {
    position: fixed; top: 0; left: 0; bottom: 0; height: auto; width: min(310px, 86vw);
    padding-top: calc(20px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-104%); transition: transform .28s ease; box-shadow: 0 0 48px var(--shade);
  }
  .rail.open { transform: none; }
  .menu-btn { display: inline-flex; }
  .scrim.open { display: block; position: fixed; inset: 0; background: rgba(8, 14, 28, .42); z-index: 35; }
}
@media (max-width: 520px) { .iconbtn .hide-sm { display: none; } }

/* ---------- lesson layout ---------- */
.scene, .home {
  max-width: 1240px;
  margin: 0 auto;
  padding-block: 26px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (min-width: 760px) {
  .scene, .home {
    padding-left: max(36px, env(safe-area-inset-left, 0px));
    padding-right: max(36px, env(safe-area-inset-right, 0px));
  }
}
.scene-head { max-width: 880px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.scene-title {
  font-family: var(--display); font-weight: 700;
  font-size: clamp(28px, 1.6vw + 20px, 44px); line-height: 1.1; letter-spacing: -0.015em;
  margin: 8px 0 14px; text-wrap: balance;
}
.bigidea { margin: 0 0 10px; font-size: 19px; line-height: 1.5; font-weight: 500; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.bigidea .lbl { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.mark { background: linear-gradient(transparent 52%, var(--mark) 52%); padding: 0 2px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.lead { margin: 0; font-size: 17px; color: var(--ink-2); max-width: 62ch; }
.scene-grid { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: clamp(22px, 3vw, 44px); align-items: start; margin-top: 26px; }
.story { min-width: 0; max-width: 64ch; }
.stage { min-width: 0; }
.stage.sticky { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 68px); }
@media (max-width: 980px) {
  .scene-grid { grid-template-columns: minmax(0, 1fr); }
  .stage { order: -1; }
  .stage.sticky { position: static; }
  .story { max-width: none; }
}
.scene-wide { max-width: 980px; margin-top: 26px; }

/* ---------- story text ---------- */
.story p, .scene-wide p { margin: 0 0 14px; text-wrap: pretty; }
.story h3, .scene-wide h3 { font-family: var(--display); font-weight: 600; font-size: 17px; line-height: 1.3; margin: 30px 0 10px; text-wrap: balance; }
.facts { list-style: none; padding: 0; margin: 0 0 14px; display: grid; gap: 6px; }
.facts li { padding: 9px 12px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; }
.story ul.dots, .scene-wide ul.dots, .story ol.steps { margin: 0 0 14px; padding-left: 22px; display: grid; gap: 6px; }
b, strong { font-weight: 600; }
.term { font-weight: 600; background: linear-gradient(transparent 62%, var(--mark) 62%); }
.g { color: var(--c1); font-weight: 600; }
.o { color: var(--c2); font-weight: 600; }
.v { color: var(--vec); font-weight: 600; }
.s { color: var(--vec2); font-weight: 600; }
.au { color: var(--gold); font-weight: 600; }
.ac { color: var(--across); font-weight: 600; }
.upc { color: var(--up); font-weight: 600; }
.bad { color: var(--bad); font-weight: 600; }
.num { font-family: var(--mono); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.small { font-size: 14.5px; color: var(--ink-2); line-height: 1.5; }
.lbl { display: block; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }

.note { margin: 18px 0; padding: 14px 16px; border-radius: 12px; }
.note .lbl { margin-bottom: 6px; }
.note > div > p:last-child { margin-bottom: 0; }
.note.key { background: var(--mark); color: var(--mark-ink); }
.note.key .lbl { color: inherit; opacity: .8; }
.note.key .g, .note.key .o, .note.key .v { filter: saturate(1.1) brightness(.85); }
.note.limit { border: 2px dashed color-mix(in srgb, var(--c2) 65%, var(--rule)); background: color-mix(in srgb, var(--c2) 6%, var(--sheet)); }
.note.limit .lbl { color: var(--c2); }
.note.think { background: var(--sheet); border: 1px solid var(--rule); }
.note.think .lbl { color: var(--vec); }
.note.think .btn { margin-top: 12px; }
.think-a { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--rule); }
details.deeper { margin: 18px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
details.deeper summary { cursor: pointer; padding: 12px 0; font-weight: 600; list-style: none; display: flex; gap: 10px; align-items: center; }
details.deeper summary::-webkit-details-marker { display: none; }
details.deeper summary::before {
  content: "+"; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
  border: 1.5px solid currentColor; font-family: var(--mono); font-size: 14px; flex: none;
}
details.deeper[open] summary::before { content: "\2212"; }
.deeper-body { padding: 0 0 14px; }
.deeper-body p { margin: 0 0 10px; }

/* ---------- stage, buttons, controls ---------- */
.stage-card {
  background: var(--sheet); border: 1px solid var(--rule); border-radius: 18px; padding: 14px;
  box-shadow: 0 18px 40px -30px var(--shade); display: grid; gap: 12px; min-width: 0;
}
.stage-title { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.prompt { font-size: 15.5px; line-height: 1.5; padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--vec) 8%, var(--sheet)); border: 1px solid color-mix(in srgb, var(--vec) 30%, var(--rule)); }
.prompt.bad { background: var(--bad-bg); border-color: color-mix(in srgb, var(--bad) 40%, var(--rule)); color: var(--ink); font-weight: 400; }
.prompt.good { background: var(--ok-bg); border-color: color-mix(in srgb, var(--ok) 40%, var(--rule)); }
.plane-wrap { position: relative; width: 100%; min-width: 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--rule); background: var(--plane); }
.plane-cv { display: block; touch-action: none; }
.plane-cv:focus-visible { outline: none; box-shadow: inset 0 0 0 3px var(--focus); }
.strip-wrap { width: 100%; min-width: 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--rule); background: var(--plane); }
.strip-cv { display: block; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 40px; padding: 8px 14px; border-radius: 11px;
  border: 1.5px solid var(--ink); background: transparent; color: var(--ink);
  font: 600 14.5px/1.2 var(--body); cursor: pointer; text-decoration: none;
  transition: transform .12s ease, background-color .2s, color .2s;
}
.btn:hover:not(:disabled) { transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: translateY(0); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.btn.ghost { border-color: var(--rule); background: var(--sheet); }
.btn.small { min-height: 34px; padding: 6px 12px; font-size: 13.5px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--vec); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-size: 14px; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1.5px solid var(--ink); border-radius: 11px; overflow: hidden; max-width: 100%; }
.seg button { border: 0; background: transparent; padding: 7px 12px; min-height: 38px; font-size: 14px; font-weight: 600; cursor: pointer; color: var(--ink); }
.seg button + button { border-left: 1.5px solid var(--ink); }
.seg button[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); }
.switch { position: relative; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14.5px; font-weight: 500; user-select: none; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.sw-track { width: 38px; height: 22px; border-radius: 99px; background: var(--rule); position: relative; transition: background-color .2s; flex: none; }
.sw-track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--sheet); box-shadow: 0 1px 2px var(--shade); transition: transform .2s ease; }
.switch input:checked + .sw-track { background: var(--vec); }
.switch input:checked + .sw-track::after { transform: translateX(16px); }
.switch input:focus-visible + .sw-track { outline: 3px solid var(--focus); outline-offset: 2px; }
.stepper { display: inline-flex; align-items: center; gap: 8px; }
.st-lab { font-size: 14.5px; font-weight: 600; }
.st-btn {
  width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--ink); background: var(--sheet);
  cursor: pointer; font-size: 18px; font-weight: 700; line-height: 1; display: grid; place-items: center; padding: 0;
}
.st-btn:disabled { opacity: .3; cursor: not-allowed; }
.st-val { min-width: 2.2ch; text-align: center; font-family: var(--mono); font-weight: 700; font-size: 19px; }
.range { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14.5px; }
.range input[type="range"] { width: min(240px, 50vw); accent-color: var(--gold); }

/* ---------- read-outs ---------- */
.readout { font-family: var(--mono); font-size: 14.5px; line-height: 1.75; font-variant-numeric: tabular-nums; overflow-x: auto; padding: 2px 0; }
.readout b { font-weight: 700; }
.eqline { white-space: nowrap; }
.vec-big { font-family: var(--mono); font-size: 32px; font-weight: 700; line-height: 1; white-space: nowrap; }
.ro-row { display: flex; flex-wrap: wrap; gap: 12px 22px; align-items: center; }
.ro-lines { display: grid; gap: 2px; font-size: 15px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; font-size: 13px; font-weight: 600; background: var(--sheet-2); }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.no { background: var(--bad-bg); color: var(--bad); }

/* ---------- matrices ---------- */
.mxg { display: inline-grid; align-items: center; gap: 4px; font-family: var(--mono); font-variant-numeric: tabular-nums; vertical-align: middle; }
.mxg .cell {
  min-width: 2.4em; height: 2.15em; padding: 0 6px; display: grid; place-items: center; border-radius: 8px;
  font-weight: 700; font-size: 17px; border: 0; background: transparent; color: var(--ink);
  transition: background-color .2s, box-shadow .2s, color .2s, opacity .2s;
}
.mxg.sm .cell { min-width: 2em; height: 1.85em; font-size: 14.5px; }

    const card = h('div', { class: 'qcard' });

    };
    const order = Q.keep ? Q.choices.map((_, i) => i) : shuffle(Q.choices.map((_, i) => i));
    const btnFor = [];
    order.forEach(ci => {
      const b = h('button', { type: 'button', class: 'qopt', html: Q.choices[ci] });
      btnFor[ci] = b;

        } else {

          if (tries >= 2 && !card.querySelector('.reveal')) {

            rv.addEventListener('click', () => {

              fb.innerHTML = '<b>Answer:</b> ' + (Q.why || ''); finish();

    });
    card.append(h('div', { class: 'qnum', text: 'Question ' + (qi + 1) }), h('div', { class: 'qtext', html: Q.q }), opts, fb);

   Part 1: Arrows and Machines
   ============================================================ */
const EGG = '\u{1F95A}', MILK = '\u{1F95B}', CAKE = '\u{1F382}', PAN = '\u{1F95E}', COOKIE = '\u{1F36A}';
const RECIPE = [[2, 1], [1, 3]];

/* ---------- Lesson 1: the recipe machine ---------- */
scene({
  id: 'recipe', part: 1,
  title: 'The Recipe Machine',
  big: 'A matrix is a machine with a recipe card.',
  lead: 'You tell the machine what to bake. It tells you what to buy.',
  mount(ctx) {
    const A = RECIPE;
    const st = { c: 3, p: 2, view: 'cols' };
    let runId = 0;
    const out = () => apply(A, [st.c, st.p]);

    const missions = Missions([
      { text: 'Order <b>just 1 cake</b> and no pancakes. Look at what comes out.', check: () => st.c === 1 && st.p === 0, win: 'It is exactly the green column: 2 eggs and 1 cup of milk.' },
      { text: 'Now order <b>just 1 plate of pancakes</b> and no cakes.', check: () => st.c === 0 && st.p === 1, win: 'It is exactly the orange column: 1 egg and 3 cups of milk.' },
      { text: 'You have <b>5 eggs and 5 cups of milk</b>. Find an order that uses up all of them.', hint: 'Start with 2 cakes. How many eggs and how much milk are left?', check: () => sameV(out(), [5, 5]), win: '2 cakes and 1 plate. Eggs: 4 + 1 = 5. Milk: 2 + 3 = 5.' },
      { text: 'Harder: use up exactly <b>7 eggs and 11 cups of milk</b>.', hint: 'Milk is the big number, and pancakes use lots of milk.', check: () => sameV(out(), [7, 11]), win: '2 cakes and 3 plates. Eggs: 4 + 3 = 7. Milk: 2 + 9 = 11.' },
    ]);

    const cakeS = Stepper({ label: emo(CAKE) + ' Cakes', name: 'cakes', value: st.c, min: 0, max: 5, onChange: v => { st.c = v; runId++; refresh(); } });
    const panS = Stepper({ label: emo(PAN) + ' Pancake plates', name: 'pancake plates', value: st.p, min: 0, max: 5, onChange: v => { st.p = v; runId++; refresh(); } });
    const card = MatrixView(A, {
      colLabels: [emo(CAKE, 'cake'), emo(PAN, 'pancakes')],
      rowLabels: [emo(EGG) + ' eggs', emo(MILK) + ' milk'],
      colColors: true, size: 'lg', aria: 'The recipe card',
    });
    const viewNote = h('p', { class: 'small', style: { margin: '0' } });
    const viewSeg = Seg([{ value: 'cols', html: 'Read down ↓' }, { value: 'rows', html: 'Read across →' }], 'cols', v => { st.view = v; paintView(); }, { label: 'How to read the card' });
    const eggChips = h('div', { class: 'chips' }), milkChips = h('div', { class: 'chips' });
    const eggN = h('output', { class: 'bin-n' }), milkN = h('output', { class: 'bin-n' });
    const calc = h('div', { class: 'calc', 'aria-live': 'polite' });
    const runBtn = h('button', { type: 'button', class: 'btn primary', html: 'Run the machine slowly <span aria-hidden="true">▸</span>' });
    runBtn.addEventListener('click', run);

    const chip = (cls, e, anim) => h('span', { class: 'chip ' + cls + (anim ? ' in' : ''), 'aria-hidden': 'true', text: e });
    function fill(box, nG, nO, e) {
      box.textContent = '';
      for (let i = 0; i < nG; i++) box.append(chip('k1', e));
      for (let i = 0; i < nO; i++) box.append(chip('k2', e));
    }
    function refresh() {
      const o = out();
      fill(eggChips, A[0][0] * st.c, A[0][1] * st.p, EGG);
      fill(milkChips, A[1][0] * st.c, A[1][1] * st.p, MILK);
      eggN.textContent = o[0]; milkN.textContent = o[1];
      card.clearHl();
      calc.innerHTML =
        emo(EGG) + ' Eggs = <span class="g">' + st.c + ' × ' + A[0][0] + '</span> + <span class="o">' + st.p + ' × ' + A[0][1] + '</span> = <b>' + o[0] + '</b><br>' +
        emo(MILK) + ' Milk = <span class="g">' + st.c + ' × ' + A[1][0] + '</span> + <span class="o">' + st.p + ' × ' + A[1][1] + '</span> = <b>' + o[1] + '</b>';
      missions.update();
    }
    async function run() {
      const my = ++runId;
      eggChips.textContent = ''; milkChips.textContent = '';
      let eg = 0, mk = 0;
      eggN.textContent = '0'; milkN.textContent = '0';
      const stamp = async (j, times) => {
        for (let k = 0; k < times; k++) {
          card.clearHl(); card.hlCol(j);
          await ctx.sleep(260); if (my !== runId) return false;
          for (let i = 0; i < A[0][j]; i++) eggChips.append(chip(j ? 'k2' : 'k1', EGG, true));
          for (let i = 0; i < A[1][j]; i++) milkChips.append(chip(j ? 'k2' : 'k1', MILK, true));
          eg += A[0][j]; mk += A[1][j];
          eggN.textContent = eg; milkN.textContent = mk;
          await ctx.sleep(360); if (my !== runId) return false;
        }
        return true;
      };
      if (!(await stamp(0, st.c))) return;
      if (!(await stamp(1, st.p))) return;
      card.clearHl();
    }
    function paintView() {
      card.el.classList.toggle('rows-view', st.view === 'rows');
      viewNote.innerHTML = st.view === 'cols'
        ? 'Each <b>column</b> is one recipe. The <span class="g">green column</span> is what 1 cake needs. The <span class="o">orange column</span> is what 1 plate of pancakes needs.'
        : 'Each <b>row</b> is one ingredient. The top row is eggs: 2 for a cake, 1 for a plate. The bottom row is milk: 1 for a cake, 3 for a plate.';
    }

    const machine = h('div', { class: 'machine' },
      h('div', { class: 'm-sec' }, h('div', { class: 'm-lbl', text: 'Your order goes in' }), h('div', { class: 'm-row' }, cakeS.el, panS.el)),
      h('div', { class: 'm-sec m-card' },
        h('div', { class: 'm-lbl', text: 'The recipe card (this is the matrix)' }),
        h('div', { class: 'm-cardwrap' }, card.el),
        h('div', { class: 'm-row' }, viewSeg.el), viewNote),
      h('div', { class: 'm-sec' },
        h('div', { class: 'm-lbl', text: 'What to buy comes out' }),
        h('div', { class: 'bin' }, h('span', { class: 'bin-name', html: emo(EGG) + ' Eggs' }), eggChips, eggN),
        h('div', { class: 'bin' }, h('span', { class: 'bin-name', html: emo(MILK) + ' Milk' }), milkChips, milkN),
        calc, h('div', { class: 'm-row' }, runBtn)));
    refresh(); paintView();

    const story = [
      P('Here are two recipes.'),
      h('ul', { class: 'facts' },
        h('li', { html: emo(CAKE) + ' 1 cake needs <b>2 eggs</b> and <b>1 cup of milk</b>.' }),
        h('li', { html: emo(PAN) + ' 1 plate of pancakes needs <b>1 egg</b> and <b>3 cups of milk</b>.' })),
      P('The machine keeps these numbers on a card. Each recipe goes <b>down</b> the card, in its own <span class="term">column</span> (a line of numbers going down, like a pillar).'),
      P('A box of numbers like this is called a <span class="term">matrix</span> (a box of numbers set out in rows and columns). A <span class="term">row</span> is a line of numbers going across.'),
      Key('Read <b>down</b> a column: you get one recipe.<br>Read <b>across</b> a row: you get one ingredient.'),
      H3('How the machine works'),
      P('Say you order 3 cakes and 2 plates of pancakes.'),
      P('Each cake adds the <span class="g">green column</span> once. So 3 cakes add it 3 times. Each plate adds the <span class="o">orange column</span> once. So 2 plates add it 2 times.'),
      P('Eggs: <span class="num"><span class="g">3 × 2</span> + <span class="o">2 × 1</span> = 8</span>. Milk: <span class="num"><span class="g">3 × 1</span> + <span class="o">2 × 3</span> = 9</span>.'),
      P('Press <b>Run the machine slowly</b> to watch each column drop in, one at a time.'),
      Key('What comes out is a <b>mix of the columns</b>: 3 lots of the green column, plus 2 lots of the orange column.'),
      Think('Can you use up exactly <b>1 egg and 1 cup of milk</b>, with whole cakes and whole plates? Try it on the machine first.',
        'No. You would need <b>0.4</b> of a cake and <b>0.2</b> of a plate. Check: eggs = 2 × 0.4 + 1 × 0.2 = 1. Milk = 1 × 0.4 + 3 × 0.2 = 1. The maths works, but no kitchen bakes 0.4 of a cake.'),
      Limit('The kitchen is a good first picture, but it has limits. You can’t bake −1 cake. You can’t bake 0.4 of a cake. Soon our numbers will be negative, and in between whole numbers. Then we need a better picture: <b>arrows</b>. They come next.'),
    ];
    const quiz = Quiz([
      { q: 'What does the <span class="o">orange column</span> of the card tell you?', choices: ['What 1 plate of pancakes needs', 'How many eggs everything needs', 'How many pancakes you ordered'], answer: 0, why: 'A column is one recipe. The orange column is the pancake recipe: 1 egg and 3 cups of milk.' },
      { q: 'You order 2 cakes and 0 pancakes. What comes out?', choices: ['4 eggs and 2 cups of milk', '2 eggs and 1 cup of milk', '4 eggs and 6 cups of milk', '2 eggs and 6 cups of milk'], answer: 0, why: '2 cakes means the cake column twice: 2 × (2 eggs, 1 milk) = 4 eggs, 2 milk.' },
      { q: 'What does the top row (eggs) tell you?', choices: ['How many eggs each thing needs', 'The cake recipe', 'How much milk you need'], answer: 0, why: 'A row is one ingredient. The egg row says: 2 eggs for each cake, 1 egg for each plate.' },
    ], { onDone: ctx.done });
    return { story, stage: h('div', { class: 'stage-card' }, machine, missions.el), quiz };
  },
});

/* ---------- Lesson 2: arrows ---------- */
scene({
  id: 'arrows', part: 1,
  title: 'Arrows',
  big: 'A vector is an arrow. Two numbers tell you exactly where it goes.',
  lead: 'Let’s leave the kitchen for a moment and meet the arrow.',
  mount(ctx) {
    const LIM = 6, B = [-LIM, LIM, -LIM, LIM];
    const st = { mode: 'point', tail: [0, 0], tip: [3, 2], steps: false, quads: false };
    const v = () => subV(st.tip, st.tail);
    const pl = ctx.plane({ range: B, label: 'A grid with a purple arrow' });
    pl.addHandle({ get: () => st.tip, set: p => { st.tip = p; }, color: () => C().vec, snap: 1, bounds: B });
    pl.addHandle({
      get: () => st.tail, color: () => C().ink2, snap: 1, r: 7, bounds: B, show: () => st.mode === 'move',
      set: p => { const tip = addV(p, v()); if (Math.abs(tip[0]) > LIM || Math.abs(tip[1]) > LIM) return; st.tail = p; st.tip = tip; },
    });
    pl.onChange = paint;
    pl.onDraw = () => {
      const K = C(), d = v();
      if (st.quads) {
        [[3.6, 5.3, '(+, +)'], [-3.6, 5.3, '(−, +)'], [-3.6, -5.3, '(−, −)'], [3.6, -5.3, '(+, −)']]
          .forEach(q => pl.text([q[0], q[1]], q[2], { color: K.ink3, size: 15, mono: true }));
      }
      if (st.mode === 'move' && (st.tail[0] || st.tail[1])) pl.arrow([0, 0], d, { color: K.vec, width: 2.5, alpha: 0.3, dash: [6, 5] });
      const corner = [st.tail[0] + d[0], st.tail[1]];
      if (st.steps) {
        const sx = Math.sign(d[0]), sy = Math.sign(d[1]);
        for (let i = 0; i < Math.abs(d[0]); i++) pl.arrow([st.tail[0] + i * sx, st.tail[1]], [st.tail[0] + (i + 1) * sx, st.tail[1]], { color: K.c1, width: 3 });
        for (let i = 0; i < Math.abs(d[1]); i++) pl.arrow([corner[0], corner[1] + i * sy], [corner[0], corner[1] + (i + 1) * sy], { color: K.c2, width: 3 });
      } else {
        if (d[0]) pl.line(st.tail, corner, { color: K.c1, width: 3, dash: [7, 6] });
        if (d[1]) pl.line(corner, st.tip, { color: K.c2, width: 3, dash: [7, 6] });
      }
      if (d[0]) pl.text([st.tail[0] + d[0] / 2, st.tail[1]], Math.abs(d[0]) + (d[0] > 0 ? ' right' : ' left'), { color: K.c1, dy: d[1] >= 0 ? 14 : -14, size: 13 });
      if (d[1]) pl.text([corner[0], corner[1] + d[1] / 2], Math.abs(d[1]) + (d[1] > 0 ? ' up' : ' down'), { color: K.c2, dx: d[0] >= 0 ? 10 : -10, align: d[0] >= 0 ? 'left' : 'right', size: 13 });
      pl.arrow(st.tail, st.tip, { color: K.vec, width: 4.5, label: vstr(d) });
      if (st.mode === 'move') pl.dot(st.tail, { r: 3, color: K.ink2 });
    };

    const ro = h('div', { class: 'ro-row', 'aria-live': 'polite' });
    const words = d => {
      if (!d[0] && !d[1]) return 'No move at all. This is the <b>zero arrow</b>.';
      const a = d[0] ? '<span class="g">' + Math.abs(d[0]) + (d[0] > 0 ? ' right' : ' left') + '</span>' : '';
      const b = d[1] ? '<span class="o">' + Math.abs(d[1]) + (d[1] > 0 ? ' up' : ' down') + '</span>' : '';
      return 'Go ' + [a, b].filter(Boolean).join(', then ') + '.';
    };
    const missions = Missions([
      { text: 'Make the arrow <span class="num">(4, 1)</span>.', check: () => sameV(v(), [4, 1]) },
      { text: 'Make the arrow <span class="num">(−2, 3)</span>.', check: () => sameV(v(), [-2, 3]), hint: 'The first number is negative, so go left.' },
      { text: 'Make an arrow that points <b>straight down</b> and is <b>3 long</b>.', check: () => sameV(v(), [0, -3]), win: '(0, −3): no steps across, 3 steps down.' },
      { text: 'Make an arrow that is <b>exactly 5 long</b>, but not lying on an axis.', hint: 'Watch the length. Try 3 across and 4 up.', check: () => { const d = v(); return d[0] !== 0 && d[1] !== 0 && d[0] * d[0] + d[1] * d[1] === 25; }, win: 'Yes! 3 across and 4 up makes a length of exactly 5. So does 4 across and 3 up.' },
    ]);
    function paint() {
      const d = v(), L = Math.hypot(d[0], d[1]);
      ro.innerHTML =
        '<div class="vec-big">(<span class="g">' + fmt(d[0]) + '</span>, <span class="o">' + fmt(d[1]) + '</span>)</div>' +
        '<div class="ro-lines"><div>' + words(d) + '</div><div>Length ' + approx(L) + '</div><div>Standing up: ' + mx([[d[0]], [d[1]]], { rows: true }) + '</div></div>';
      missions.update();
      pl.render();
    }
    const modeSeg = Seg([{ value: 'point', html: 'Start at the origin' }, { value: 'move', html: 'Slide it around' }], 'point', m => {
      st.mode = m;
      if (m === 'point') { const d = v(); st.tail = [0, 0]; st.tip = [clamp(d[0], -LIM, LIM), clamp(d[1], -LIM, LIM)]; }
      tipNote.innerHTML = m === 'point' ? 'Drag the <span class="v">purple dot</span> to change the arrow.' : 'Drag the <b>dark dot</b> at the start to slide the arrow. Watch its numbers: they stay the same!';
      paint();
    }, { label: 'Arrow mode' });
    const tipNote = h('div', { class: 'small', html: 'Drag the <span class="v">purple dot</span> to change the arrow.' });
    const tSteps = Toggle({ id: ctx.id('steps'), label: 'Show the steps', checked: false, onChange: c => { st.steps = c; pl.render(); } });
    const tQuads = Toggle({ id: ctx.id('quads'), label: 'Show the four quarters', checked: false, onChange: c => { st.quads = c; pl.render(); } });
    paint();

    const story = [
      P('Look at the grid. In maths, this flat world is called a <span class="term">plane</span> (a flat surface that goes on forever).'),
      P('The middle point is the <span class="term">origin</span> (the starting point). Its name is (0, 0).'),
      P('The line going across is the <span class="term">x-axis</span>. The line going up is the <span class="term">y-axis</span>. (An axis is a main line that we measure along.)'),
      P('A <span class="term">vector</span> is an arrow. It has a <b>direction</b> (which way it points) and a <b>length</b> (how long it is).'),
      P('We write an arrow with two numbers, like <span class="num">(3, 2)</span>.'),
      h('ul', { class: 'facts' },
        h('li', { html: 'The <span class="g">first number</span> says how far to go <b>across</b>. Right is +. Left is −.' }),
        h('li', { html: 'The <span class="o">second number</span> says how far to go <b>up</b>. Up is +. Down is −.' })),
      P('So <span class="num">(3, 2)</span> means: 3 steps right, then 2 steps up. The two numbers are called the <span class="term">components</span> of the arrow (its parts).'),
      Key('<span class="num">(3, 2)</span> is not two separate numbers. It is <b>one arrow</b>. Always picture the arrow.'),
      P('Order matters. <span class="num">(3, 2)</span> and <span class="num">(2, 3)</span> are different arrows. Across always comes first.'),
      P('We can also write the arrow standing up, as a column: ' + mx([[3], [2]], { rows: true }) + '. It is the same arrow, written a different way.'),
      P('The two axes cut the plane into 4 pieces called <span class="term">quadrants</span> (quarter pieces). Each one has its own signs, like (+, +) or (−, +).'),
      H3('An arrow is a move'),
      P('An arrow does not have to start at the origin. Pick <b>Slide it around</b>, then drag the start of the arrow.'),
      P('Its numbers do not change! <span class="num">(3, 2)</span> always means “3 right, 2 up”, wherever you start.'),
      P('When an arrow starts at the origin, its tip lands on a point. Then <span class="num">(3, 2)</span> is also the name of that point.'),
      Think('An arrow starts at <span class="num">(1, 1)</span> and ends at <span class="num">(4, 3)</span>. What are its two numbers?',
        '<span class="num">(3, 2)</span>. Across: 4 − 1 = 3. Up: 3 − 1 = 2. It is the end minus the start.'),
      Deeper('How do we find the length?',
        '<p>Make a right-angled triangle: 3 across and 2 up. The arrow is the long side.</p><p>Its length is <span class="num">√(3² + 2²) = √13 ≈ 3.61</span>. (√ means “square root”: the number that, times itself, gives 13.)</p><p>This is called <b>Pythagoras’ rule</b>. You don’t need it yet. Just see that every arrow has a length.</p>'),
    ];
    const quiz = Quiz([
      { q: 'Which arrow goes 2 left and 1 up?', choices: ['(−2, 1)', '(2, −1)', '(1, −2)', '(−1, 2)'], answer: 0, why: 'Across comes first: 2 left is −2. Then up: 1 up is +1.' },
      { q: 'An arrow starts at (1, 1) and ends at (4, 3). Which move is it?', choices: ['(3, 2)', '(4, 3)', '(5, 4)', '(1, 1)'], answer: 0, why: 'End minus start: (4 − 1, 3 − 1) = (3, 2).' },
      { q: 'Are (2, 3) and (3, 2) the same arrow?', choices: ['No', 'Yes'], answer: 0, keep: true, why: '(2, 3) goes 2 right and 3 up. (3, 2) goes 3 right and 2 up. Different arrows.' },
      { q: 'Where does the arrow (−3, −1) point?', choices: ['Down and to the left (−, −)', 'Up and to the left (−, +)', 'Down and to the right (+, −)', 'Up and to the right (+, +)'], answer: 0, why: 'Both numbers are negative: left and down.' },
    ], { onDone: ctx.done });
    const stage = h('div', { class: 'stage-card' },
      h('div', { class: 'controls' }, modeSeg.el), tipNote, pl.el, ro,
      h('div', { class: 'controls' }, tSteps.el, tQuads.el), missions.el);
    return { story, stage, quiz };
  },
});

/* ---------- Lesson 3: adding and stretching arrows ---------- */
scene({
  id: 'add-stretch', part: 1,
  title: 'Adding and Stretching Arrows',
  big: 'Add arrows tip to tail. Stretch an arrow by multiplying it by a number.',
  lead: 'Arrows are moves. So we can do one move, and then another.',
  mount(ctx) {
    const LIM = 5, B = [-LIM, LIM, -LIM, LIM];
    const st = { mode: 'add', a: [3, 1], b: [1, 2], k: 2, ba: false };
    const pl = ctx.plane({ range: [-7.5, 7.5, -7.5, 7.5], label: 'A grid with two arrows, a and b' });
    pl.addHandle({ get: () => st.a, set: p => { st.a = p; }, color: () => C().vec, snap: 1, bounds: B });
    pl.addHandle({ get: () => st.b, set: p => { st.b = p; }, color: () => C().vec2, snap: 1, bounds: B, show: () => st.mode !== 'scale' });
    pl.onChange = paint;
    pl.onDraw = () => {
      const K = C(), a = st.a, b = st.b;
      if (st.mode === 'add') {
        const s = addV(a, b);
        if (st.ba) {
          pl.poly([[0, 0], a, s, b], { fill: K.gold, fillAlpha: 0.12 });
          pl.arrow([0, 0], b, { color: K.vec2, width: 3.5, label: 'b' });
          pl.arrow(b, s, { color: K.vec, width: 3, dash: [7, 5], alpha: 0.85 });
        } else pl.arrow([0, 0], b, { color: K.vec2, width: 2.5, alpha: 0.35, dash: [6, 5], label: 'b' });
        pl.arrow([0, 0], a, { color: K.vec, width: 4, label: 'a' });
        pl.arrow(a, s, { color: K.vec2, width: 4 });
        pl.arrow([0, 0], s, { color: K.gold, width: 5, label: 'a + b' });
      } else if (st.mode === 'sub') {
        const s = subV(a, b);
        pl.arrow(b, a, { color: K.gold, width: 2.5, alpha: 0.45, dash: [6, 5] });
        pl.arrow([0, 0], b, { color: K.vec2, width: 4, label: 'b' });
        pl.arrow([0, 0], a, { color: K.vec, width: 4, label: 'a' });
        pl.arrow(a, s, { color: K.vec2, width: 3, dash: [7, 5], label: '−b' });
        pl.arrow([0, 0], s, { color: K.gold, width: 5, label: 'a − b' });
      } else {
        const s = scaleV(a, st.k);
        pl.arrow([0, 0], s, { color: K.gold, width: 6, alpha: 0.9, label: fmt(st.k) + ' × a' });
        pl.arrow([0, 0], a, { color: K.vec, width: 3, label: 'a' });
      }
    };
    const eq = h('div', { class: 'readout', 'aria-live': 'polite' });
    const kOut = h('output', { class: 'num' });
    const kIn = h('input', { type: 'range', min: '-3', max: '3', step: '0.5', value: '2', id: ctx.id('k'), 'aria-label': 'The number k' });
    kIn.addEventListener('input', () => { st.k = parseFloat(kIn.value); paint(); });
    const kRow = h('label', { class: 'range', for: ctx.id('k') }, 'k =', kIn, kOut);
    const tBA = Toggle({ id: ctx.id('ba'), label: 'Also show b + a', checked: false, onChange: c => { st.ba = c; pl.render(); } });
    const note = h('div', { class: 'small' });
    const missions = Missions([
      { text: 'In <b>a + b</b>: make <b>a + b</b> land on <span class="num">(5, 0)</span>.', check: () => st.mode === 'add' && sameV(addV(st.a, st.b), [5, 0]) },
      { text: 'In <b>a − b</b>: make <b>a − b</b> equal <span class="num">(0, 0)</span>.', check: () => st.mode === 'sub' && sameV(subV(st.a, st.b), [0, 0]), win: 'a − b is zero when a and b are the same arrow.' },
      { text: 'In <b>k × a</b>: pick k so that the gold arrow points the <b>other way</b> and is <b>twice as long</b>.', check: () => st.mode === 'scale' && st.k === -2 && (st.a[0] || st.a[1]), win: 'k = −2. The minus turns it around. The 2 doubles it.' },
    ]);
    function paint() {
      const a = st.a, b = st.b;
      if (st.mode === 'add') {
        const s = addV(a, b);
        eq.innerHTML = '<span class="v">a</span> + <span class="s">b</span> = <span class="v">' + vstr(a) + '</span> + <span class="s">' + vstr(b) + '</span><br>= (' + fmt(a[0]) + ' + ' + pn(b[0]) + ', ' + fmt(a[1]) + ' + ' + pn(b[1]) + ') = <b class="au">' + vstr(s) + '</b>';
        note.innerHTML = 'Drag the <span class="v">purple dot</span> to change a. Drag the <span class="s">blue dot</span> to change b. The solid blue arrow is b, moved so its tail sits on the tip of a.';
      } else if (st.mode === 'sub') {
        const s = subV(a, b);
        eq.innerHTML = '<span class="v">a</span> − <span class="s">b</span> = <span class="v">' + vstr(a) + '</span> − <span class="s">' + vstr(b) + '</span><br>= (' + fmt(a[0]) + ' − ' + pn(b[0]) + ', ' + fmt(a[1]) + ' − ' + pn(b[1]) + ') = <b class="au">' + vstr(s) + '</b>';
        note.innerHTML = '−b is b turned around. a − b is a, then −b. The faint dashed arrow shows the same answer, going from the tip of b to the tip of a.';
      } else {
        const s = scaleV(a, st.k);
        eq.innerHTML = fmt(st.k) + ' × <span class="v">' + vstr(a) + '</span> = (' + fmt(st.k) + ' × ' + pn(a[0]) + ', ' + fmt(st.k) + ' × ' + pn(a[1]) + ') = <b class="au">' + vstr(s) + '</b>';
        note.innerHTML = st.k < 0 ? 'k is negative, so the arrow turns around.' : st.k === 0 ? 'k is 0, so the arrow shrinks to nothing.' : st.k < 1 ? 'k is less than 1, so the arrow gets shorter.' : st.k === 1 ? 'k is 1, so nothing changes.' : 'k is more than 1, so the arrow gets longer.';
      }
      kOut.textContent = fmt(st.k);
      kRow.hidden = st.mode !== 'scale';
      tBA.el.hidden = st.mode !== 'add';
      missions.update();
      pl.render();
    }
    const modeSeg = Seg([{ value: 'add', html: 'a + b' }, { value: 'sub', html: 'a − b' }, { value: 'scale', html: 'k × a' }], 'add', m => { st.mode = m; paint(); }, { label: 'What to do with the arrows' });
    paint();

    const story = [
      P('Do move <span class="v">a</span>, then move <span class="s">b</span>. Where do you end up?'),
      P('Put the tail of <span class="s">b</span> on the tip of <span class="v">a</span>. This is called <span class="term">tip-to-tail</span> (the start of one arrow sits on the end of the other).'),
      P('The arrow from the very start to the very end is <b class="au">a + b</b>.'),
      P('With numbers, add the across parts, and add the up parts:'),
      P('<span class="num">(3, 1) + (1, 2)</span> <span class="num">= (3 + 1, 1 + 2)</span> <span class="num">= (4, 3)</span>'),
      P('Now switch on <b>Also show b + a</b>. Doing b first lands on the same spot! The two paths make a <span class="term">parallelogram</span> (a slanted box whose opposite sides match).'),
      Key('a + b = b + a. When you add arrows, the order does not matter.'),
      H3('Taking away'),
      P('<b>−b</b> is b turned around: same length, opposite direction.'),
      P('<b>a − b</b> means a + (−b): do a, then do b backwards.'),
      P('There is a second way to see it: a − b is the arrow that goes from the tip of b to the tip of a.'),
      H3('Stretching'),
      P('Multiply an arrow by a number. <b>2 × a</b> is twice as long. <b>0.5 × a</b> is half as long. <b>−1 × a</b> points the other way.'),
      P('A plain number like this is called a <span class="term">scalar</span> (a number that scales: it stretches or shrinks).'),
      P('With numbers, multiply each part: <span class="num">2 × (3, 1) = (6, 2)</span>.'),
      Think('If a + b = (0, 0), what does b look like?', 'b is a turned around: <b>b = −a</b>. You go out along a, and come straight back along b.'),
    ];
    const quiz = Quiz([
      { q: '(2, 5) + (3, −1) = ?', choices: ['(5, 4)', '(5, 6)', '(6, 5)', '(−1, 6)'], answer: 0, why: 'Across: 2 + 3 = 5. Up: 5 + (−1) = 4.' },
      { q: '3 × (1, −2) = ?', choices: ['(3, −6)', '(4, 1)', '(3, −2)', '(1, −6)'], answer: 0, why: 'Multiply each part by 3: (3 × 1, 3 × (−2)) = (3, −6).' },
      { q: '(4, 1) − (1, 3) = ?', choices: ['(3, −2)', '(5, 4)', '(3, 2)', '(−3, 2)'], answer: 0, why: 'Across: 4 − 1 = 3. Up: 1 − 3 = −2.' },
    ], { onDone: ctx.done });
    const stage = h('div', { class: 'stage-card' }, h('div', { class: 'controls' }, modeSeg.el), note, pl.el, eq,
      h('div', { class: 'controls' }, tBA.el, kRow), missions.el);
    return { story, stage, quiz };
  },
});

/* ---------- Lesson 4: the big link ---------- */

      { text: 'Switch on <b>negative orders</b>. Make the output <span class="num">(1, −2)</span>.', check: () => sameV(apply(A, [st.c, st.p]), [1, -2]), hint: 'Try 1 cake and −1 plates.', win: '1 cake and −1 plates: (2, 1) − (1, 3) = (1, −2).' },
    ]);
    function paint() {

      P('That is an arrow!'),
      P('The machine turns it into <span class="num">(8, 9)</span>: 8 eggs and 9 cups of milk. That is an arrow too.'),
      Key('A matrix is a machine that turns arrows into new arrows.'),
      P('Look at the left drawing. The order <span class="num">(3, 2)</span> is made of small steps: 3 <span class="g">green steps</span> of <span class="num">(1, 0)</span>, then 2 <span class="o">orange steps</span> of <span class="num">(0, 1)</span>.'),
      P('Now the right drawing. Each green step became the cake column <span class="num g">(2, 1)</span>. Each orange step became the pancake column <span class="num o">(1, 3)</span>.'),
      P('So the output is <span class="num">3 × (2, 1) + 2 × (1, 3)</span> <span class="num">= (6, 3) + (2, 6)</span> <span class="num">= (8, 9)</span>.'),
      Key('The <b>columns</b> of a matrix tell you where <span class="num g">(1, 0)</span> and <span class="num o">(0, 1)</span> go. Once you know that, you know where <b>every</b> arrow goes.', 'The most important idea'),
      P('This is the most important idea in the whole journey. Read it again, slowly.'),
      Limit('Switch on <b>Allow negative orders</b>. Now you can order −1 cakes. That makes no sense in a kitchen. But for arrows it is fine: −1 just means “point the other way”. From now on, we leave the kitchen and keep the arrows.'),
    ];
    const quiz = Quiz([
      { q: 'The order (1, 0) gives which part of the card?', choices: ['Column 1 (green)', 'Row 1', 'Column 2 (orange)', 'The whole card'], answer: 0, why: 'One cake and no pancakes gives exactly the cake recipe: column 1.' },
      { q: 'Column 1 is (2, 1). Column 2 is (1, 3). What does the order (2, 2) give?', choices: ['(6, 8)', '(4, 6)', '(3, 4)', '(8, 6)'], answer: 0, why: '2 × (2, 1) + 2 × (1, 3) = (4, 2) + (2, 6) = (6, 8).' },
      { q: 'True or false: if you know where (1, 0) and (0, 1) go, you know where every arrow goes.', choices: ['True', 'False'], answer: 0, keep: true, why: 'Every arrow is some greens plus some oranges. So its output is the same number of new greens plus new oranges.' },

    const stage = h('div', { class: 'stage-card' },

        h('div', {}, h('div', { class: 'duo-cap', html: 'OUT: what to buy' }), outPl.el)),
      h('div', { class: 'mxrow' }, h('span', { class: 'small', text: 'The machine:' }), card.el),
