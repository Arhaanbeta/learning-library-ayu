<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Grammar of Graphs — a guided film</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#0B1322; --panel:#0F1B2E; --panel2:#0D1728; --line:#1C2C45; --line2:#22344E;
  --ink:#E9EFF8; --soft:#8FA3BC; --amber:#F2B84B; --teal:#53D6C7; --plum:#C792EA;
  --coral:#FF8A5C; --warn:#FF6B6B; --ok:#7BD88F; --violet:#9B8CFF;
  --serif:Georgia,'Iowan Old Style','Times New Roman',serif;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box} html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 700px at 60% -10%, #101E36 0%, var(--bg) 55%);
  color:var(--ink);font-family:var(--sans);overflow:hidden;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:6px}

/* ---------- header ---------- */
header{display:flex;align-items:baseline;gap:18px;padding:14px 22px 10px;border-bottom:1px solid var(--line)}
.kick{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--soft)}
h1{font-family:var(--serif);font-weight:600;font-size:21px;margin:0}
.runtime{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--soft);letter-spacing:.08em}
#tocbtn{display:none;border:1px solid var(--line2);border-radius:8px;padding:6px 12px;font-size:13px;color:var(--soft)}

/* ---------- shell ---------- */
.shell{flex:1;display:flex;min-height:0}
nav{width:288px;min-width:288px;border-right:1px solid var(--line);overflow-y:auto;padding:10px 0 24px;background:rgba(13,23,40,.5)}
nav h2{font-family:var(--mono);font-size:10px;letter-spacing:.24em;color:var(--soft);margin:10px 20px 8px;font-weight:600}
.tocitem{display:block;width:100%;text-align:left;padding:11px 18px 13px 20px;position:relative;border-left:3px solid transparent}
.tocitem:hover{background:#12203795}
.tocitem.active{background:#14233B;border-left-color:var(--amber)}
.tocitem .row{display:flex;gap:10px;align-items:baseline}
.tocitem .idx{font-family:var(--mono);font-size:11px;color:var(--soft);width:20px}
.tocitem.done .idx{color:var(--ok)}
.tocitem .tt{font-size:13.5px;flex:1;line-height:1.3}
.tocitem .dur{font-family:var(--mono);font-size:10.5px;color:var(--soft)}
.tocitem .bar{position:absolute;left:20px;right:18px;bottom:6px;height:2px;background:var(--line);border-radius:2px}
.tocitem .bar i{display:block;height:100%;width:0%;background:var(--teal);border-radius:2px}

main{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0;padding:16px 26px 8px;overflow:hidden}
.kicker{align-self:flex-start;max-width:1020px;width:100%;margin:0 auto 8px;font-family:var(--mono);
  font-size:11px;letter-spacing:.22em;color:var(--amber)}
.kicker b{color:var(--soft);font-weight:400}
.stagewrap{width:100%;max-width:1020px;aspect-ratio:16/9;background:var(--panel2);
  border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;
  box-shadow:0 30px 80px -40px rgba(0,0,0,.8)}
svg{display:block;width:100%;height:100%}
.capwrap{width:100%;max-width:1020px;margin:12px auto 0;min-height:64px;display:flex;align-items:flex-start;justify-content:center}
#cap{font-size:clamp(15px,1.7vw,20px);line-height:1.5;text-align:center;max-width:72ch;margin:0;color:var(--ink)}
#cap b{color:var(--amber);font-weight:600} #cap i{color:var(--teal);font-style:normal;font-weight:600}
#cap em{color:var(--plum);font-style:normal;font-weight:600}
.swap{animation:rise .5s ease both}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

/* ---------- footer / transport ---------- */
footer{border-top:1px solid var(--line);background:var(--panel);padding:12px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.tbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);color:var(--soft);font-size:15px;display:grid;place-items:center}
.tbtn:hover{color:var(--ink);border-color:var(--soft)}
#play{width:48px;height:48px;background:var(--amber);color:#0B1322;font-size:19px;border:0}
#play:hover{filter:brightness(1.08)}
.prog{flex:1;min-width:200px;height:26px;display:flex;align-items:center;cursor:pointer;position:relative}
.prog .track{position:absolute;left:0;right:0;height:5px;background:var(--line2);border-radius:3px}
.prog .fill{position:absolute;left:0;height:5px;background:var(--amber);border-radius:3px;width:0%}
.prog .notch{position:absolute;top:8px;width:2px;height:10px;background:#31486B}
#clock{font-family:var(--mono);font-size:12px;color:var(--soft);min-width:96px;text-align:center}
.speed{display:flex;align-items:center;gap:10px}
.speed label{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--soft)}
#spdrange{width:170px;accent-color:var(--amber);height:26px}
#spdval{font-family:var(--mono);font-size:12px;color:var(--amber);min-width:44px;text-align:right}
.spdchip{font-family:var(--mono);font-size:10.5px;color:var(--soft);border:1px solid var(--line2);border-radius:20px;padding:3px 9px}
.spdchip:hover{color:var(--ink)}
kbd{font-family:var(--mono);font-size:10px;color:var(--soft)}
.hints{font-family:var(--mono);font-size:10px;color:var(--soft);letter-spacing:.04em}

/* ---------- SVG classes ---------- */
text{font-family:var(--mono)} .serif{font-family:var(--serif)}
.ink{fill:var(--ink)} .soft{fill:var(--soft)} .tick{fill:#5F7492} .mono{font-family:var(--mono)}
.grid{stroke:var(--line2);stroke-width:1} .axis{stroke:#C7D4E6;stroke-width:2;stroke-linecap:round}
.lab{letter-spacing:.06em} .q-time{fill:var(--amber)} .q-pos{fill:var(--teal)} .q-rate{fill:var(--coral)}
.q-plum{fill:var(--plum)} .q-violet{fill:var(--violet)}
.c-pos{stroke:var(--teal);stroke-width:3;fill:none;stroke-linecap:round}
.c-b{stroke:var(--plum);stroke-width:3;fill:none;stroke-dasharray:9 6;stroke-linecap:round}
.c-rate{stroke:var(--coral);stroke-width:3;fill:none;stroke-linecap:round}
.c-violet{stroke:var(--violet);stroke-width:3;fill:none;stroke-linecap:round}
.c-warn{stroke:var(--warn);stroke-width:3;fill:none;stroke-linecap:round}
.c-ok{stroke:var(--ok);stroke-width:3;fill:none;stroke-linecap:round}
.ghost{stroke:#6B7FA0;stroke-width:2.5;fill:none;stroke-dasharray:3 6;stroke-linecap:round}
.dash{stroke:#5F7492;stroke-width:1.5;stroke-dasharray:4 5;fill:none}
.thick{stroke-width:3.5}
.dot{fill:var(--teal)} .dot-b{fill:var(--plum)} .dot-soft{fill:#41597c}
.ring{fill:none;stroke:var(--ink);stroke-width:2.5}
.ring-a{fill:none;stroke:var(--amber);stroke-width:2.5}
.area{fill:rgba(83,214,199,.16);stroke:none}
.area-x{fill:rgba(255,107,107,.13);stroke:none}
.floor{stroke:#C7D4E6;stroke-width:2.5;stroke-linecap:round} .tickline{stroke:#5F7492;stroke-width:1}
.chip-bg{fill:#16273f;stroke:var(--line2)} .chip-t{fill:var(--ink)}
.chipA-bg{fill:#2b2312;stroke:#6b5522} .chipA-t{fill:var(--amber)}
.chipT-bg{fill:#0f2b29;stroke:#1f5a54} .chipT-t{fill:var(--teal)}
.chipR-bg{fill:#331c10;stroke:#7a4526} .chipR-t{fill:var(--coral)}
.stamp-warn{fill:rgba(255,107,107,.08);stroke:var(--warn);stroke-width:2.5}
.stamp-warn-t{fill:var(--warn);font-weight:700;letter-spacing:.08em}
.stamp-ok{fill:rgba(123,216,143,.08);stroke:var(--ok);stroke-width:2.5}
.stamp-ok-t{fill:var(--ok);font-weight:700;letter-spacing:.08em}
.hill{fill:#182A44;stroke:#31486B;stroke-width:1.5}
.title-big{fill:var(--ink);font-family:var(--serif);font-weight:600}
.glow{filter:drop-shadow(0 0 6px rgba(242,184,75,.45))}

/* ---------- responsive ---------- */
@media (max-width:920px){
  nav{position:fixed;z-index:30;top:0;bottom:0;left:0;transform:translateX(-100%);transition:transform .25s ease;background:var(--panel)}
  nav.open{transform:none;box-shadow:20px 0 60px rgba(0,0,0,.5)}
  #tocbtn{display:block}
  main{padding:12px 12px 6px}
  footer{gap:10px;padding:10px 12px}
  .hints{display:none}
}
</style>
</head>
<body>
<header>
  <button id="tocbtn" aria-label="Show chapters">☰ Chapters</button>
  <div>
    <div class="kick">ATLAS OF CHANGE · A GUIDED FILM IN 11 CHAPTERS</div>
    <h1>The Grammar of Graphs</h1>
  </div>
  <div class="runtime" id="runtime"></div>
</header>

<div class="shell">
  <nav id="toc" aria-label="Chapters"><h2>CHAPTERS — CLICK TO JUMP</h2></nav>
  <main>
    <div class="kicker" id="kicker"></div>
    <div class="stagewrap"><svg id="stage" viewBox="0 0 960 540" role="img" aria-label="Animated illustration"></svg></div>
    <div class="capwrap"><p id="cap"></p></div>
  </main>
</div>

<footer>
  <button class="tbtn" id="prev" title="Previous chapter (←)" aria-label="Previous chapter">⏮</button>
  <button class="tbtn" id="play" title="Play / pause (space)" aria-label="Play or pause">▶</button>
  <button class="tbtn" id="next" title="Next chapter (→)" aria-label="Next chapter">⏭</button>
  <div class="prog" id="prog" title="Seek"><div class="track"></div><div class="fill" id="fill"></div></div>
  <span id="clock">0:00 / 0:00</span>
  <div class="speed">
    <label for="spdrange">SPEED</label>
    <button class="spdchip" data-s="0.5">½×</button>
    <input id="spdrange" type="range" min="0.2" max="4" step="0.05" value="1" aria-label="Playback speed">
    <button class="spdchip" data-s="2">2×</button>
    <span id="spdval">1.0×</span>
  </div>
  <span class="hints"><kbd>space</kbd> play · <kbd>←→</kbd> chapters · <kbd>↑↓</kbd> speed</span>
</footer>
<script>
'use strict';
/* ================= tiny SVG builder ================= */
let S=[];
const A=s=>S.push(s);
const n1=v=>{const r=Math.round(v*10)/10;return Number.isInteger(r)?String(r):r.toFixed(1)};
const n2=v=>{const r=Math.round(v*100)/100;return Number.isInteger(r)?String(r):String(r)};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const seg=(p,a,b)=>clamp((p-a)/(b-a),0,1);
const ez=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const pop=p=>{const q=clamp(p,0,1);return q<.7?ez(q/.7)*1.06:1.06-.06*ez((q-.7)/.3)};
function T(x,y,t,cls='ink',anc='start',sz=13,extra=''){A(`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" class="${cls}" text-anchor="${anc}" font-size="${sz}" ${extra}>${t}</text>`)}
function Ln(x1,y1,x2,y2,cls,extra=''){A(`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" class="${cls}" ${extra}/>`)}
function Ci(cx,cy,r,cls,extra=''){A(`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r}" class="${cls}" ${extra}/>`)}
function Rt(x,y,w,h,cls,rx=0,extra=''){A(`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="${rx}" class="${cls}" ${extra}/>`)}
function Pa(d,cls,extra=''){A(`<path d="${d}" class="${cls}" ${extra}/>`)}
function gO(op,extra=''){A(`<g opacity="${clamp(op,0,1).toFixed(3)}" ${extra}>`)}
function gT(tr){A(`<g transform="${tr}">`)}
function gC(){A('</g>')}

/* ================= graph frame ================= */
function frame(fx,fy,fw,fh,xmax,ymax,o={}){
  const X=v=>fx+v/xmax*fw, Y=v=>fy+fh-v/ymax*fh;
  const gx=o.gx||1, gy=o.gy||1;
  if(!o.nogrid){
    for(let v=gx;v<=xmax+1e-9;v+=gx)Ln(X(v),Y(0),X(v),Y(ymax),'grid');
    for(let v=gy;v<=ymax+1e-9;v+=gy)Ln(X(0),Y(v),X(xmax),Y(v),'grid');
  }
  Ln(X(0),Y(0),X(xmax),Y(0),'axis');Ln(X(0),Y(0),X(0),Y(ymax),'axis');
  const tx=o.tx??2, ty=o.ty??2;
  if(!o.noticks){
    for(let v=0;v<=xmax+1e-9;v+=tx)T(X(v),Y(0)+17,n1(v),'tick','middle',10.5);
    for(let v=0;v<=ymax+1e-9;v+=ty)T(X(0)-8,Y(v)+3.5,n1(v),'tick','end',10.5);
  }
  if(o.xl)T(X(xmax/2),fy+fh+36,o.xl,'lab '+(o.xcls||'q-time'),'middle',12.5);
  if(o.yl)A(`<text x="${(fx-40).toFixed(1)}" y="${(fy+fh/2).toFixed(1)}" class="lab ${o.ycls||'q-pos'}" text-anchor="middle" font-size="12.5" transform="rotate(-90 ${(fx-40).toFixed(1)} ${(fy+fh/2).toFixed(1)})">${o.yl}</text>`);
  return {X,Y,fx,fy,fw,fh,xmax,ymax};
}
function curve(m,f,x0,x1,cls,rev=1,extra=''){
  const r=clamp(rev,0,1);if(r<=0)return;
  const N=72,xe=x0+(x1-x0)*r;let d='';
  for(let i=0;i<=N;i++){const x=x0+(xe-x0)*i/N;d+=`${i?'L':'M'}${m.X(x).toFixed(1)} ${m.Y(f(x)).toFixed(1)} `}
  Pa(d,cls,extra);
}
function dots(m,pts,cls,upTo=1,pr=1){
  const k=Math.floor(pts.length*clamp(upTo,0,1)+1e-6);
  for(let i=0;i<k;i++){
    const grow=(i===k-1&&upTo<1)?pop(pr):1;
    Ci(m.X(pts[i][0]),m.Y(pts[i][1]),4.6*grow,cls);
  }
}
function cross(m,xv,yv,o={}){
  const p=o.p==null?1:clamp(o.p,0,1);
  const p1=seg(p,0,.5),p2=seg(p,.4,.9);
  if(p2>0)Ln(m.X(xv),m.Y(0),m.X(xv),m.Y(0)+(m.Y(yv)-m.Y(0))*p2,'dash');
  if(p1>0)Ln(m.X(0),m.Y(yv),m.X(0)+(m.X(xv)-m.X(0))*p1,m.Y(yv),'dash');
  if(p>.85)Ci(m.X(xv),m.Y(yv),o.r||8,'ring-a glow');
  if(o.xl&&p>.9)chip(m.X(xv),m.Y(0)+34,o.xl,'chipA');
  if(o.yl&&p>.55)chip(m.X(0)-10,m.Y(yv)-2,o.yl,'chipT','end');
}
function tri(m,f,x1,x2,pr,o={}){
  const y1=f(x1),y2=f(x2);
  const p1=seg(pr,0,.45),p2=seg(pr,.45,.9);
  Ci(m.X(x1),m.Y(y1),5.5,'ring');Ci(m.X(x2),m.Y(y2),5.5,'ring');
  if(p1>0)Ln(m.X(x1),m.Y(y1),m.X(x1)+(m.X(x2)-m.X(x1))*p1,m.Y(y1),'c-rate thick');
  if(p2>0)Ln(m.X(x2),m.Y(y1),m.X(x2),m.Y(y1)+(m.Y(y2)-m.Y(y1))*p2,'c-rate thick');
  if(p1>.85)chip(m.X((x1+x2)/2),m.Y(y1)+24,o.dt||`Δtime = ${n1(x2-x1)} s`,'chipR');
  if(p2>.85)chip(m.X(x2)+14,m.Y((y1+y2)/2)+4,o.dx||`Δposition = ${n1(y2-y1)} m`,'chipR','start');
}
function tangent(m,f,x,lenPx,cls='c-rate',h=.02){
  // Numeric derivative, then a fixed PIXEL-length segment along the screen direction of
  // the tangent, clamped to the frame — so a steep slope can never slash across the film.
  const s=(f(x+h)-f(x-h))/(2*h);
  const ux=m.fw/m.xmax, uy=m.fh/m.ymax;           // px per unit on each axis
  const hyp=Math.hypot(ux,s*uy), k=lenPx/2/hyp;
  const cx=m.X(x), cy=m.Y(f(x));
  const x1=clamp(cx-ux*k,m.fx,m.fx+m.fw), y1=clamp(cy+s*uy*k,m.fy,m.fy+m.fh);
  const x2=clamp(cx+ux*k,m.fx,m.fx+m.fw), y2=clamp(cy-s*uy*k,m.fy,m.fy+m.fh);
  Ln(x1,y1,x2,y2,cls+' thick');
  Ci(cx,cy,5,'dot');
  return s;
}
function areaUnder(m,f,x0,x1,cls,rev=1){
  const r=clamp(rev,0,1);if(r<=0)return;
  const N=60,xe=x0+(x1-x0)*r;let d=`M${m.X(x0).toFixed(1)} ${m.Y(0).toFixed(1)} `;
  for(let i=0;i<=N;i++){const x=x0+(xe-x0)*i/N;d+=`L${m.X(x).toFixed(1)} ${m.Y(f(x)).toFixed(1)} `}
  d+=`L${m.X(xe).toFixed(1)} ${m.Y(0).toFixed(1)} Z`;Pa(d,cls);
}
function slices(m,f,x0,x1,n,upTo){
  const k=Math.floor(n*clamp(upTo,0,1)+1e-6),w=(x1-x0)/n;let sum=0;
  for(let i=0;i<k;i++){
    const xa=x0+i*w,mid=xa+w/2,hgt=f(mid);sum+=hgt*w;
    Rt(m.X(xa),m.Y(hgt),m.X(xa+w)-m.X(xa),m.Y(0)-m.Y(hgt),'area');
    Ln(m.X(xa),m.Y(0),m.X(xa),m.Y(hgt),'grid');
  }
  return sum;
}

/* ================= world (corridor) ================= */
function worldStrip(yB,walkers,o={}){
  const x0=o.x0||150,x1=o.x1||810,M=v=>x0+(v/12)*(x1-x0);
  if(o.rot){gT(`rotate(${o.rot} ${(x0+x1)/2} ${yB}) translate(0 ${o.rotLift||0}) scale(${o.rotScale||1})`)}
  Ln(x0-3,yB,x1+3,yB,'floor');
  for(let mm=0;mm<=12;mm++){
    Ln(M(mm),yB,M(mm),yB+(mm%2?5:9),'tickline');
    if(mm%2===0)T(M(mm),yB+23,mm,'tick','middle',10,o.rot?`transform="rotate(${-o.rot} ${M(mm).toFixed(1)} ${(yB+23).toFixed(1)})"`:'');
  }
  Ln(x0-3,yB-50,x0-3,yB,'floor');Ln(x1+3,yB-50,x1+3,yB,'floor');
  if(!o.rot&&o.axisTag!=='')T((x0+x1)/2,yB+40,o.axisTag||'metres along the corridor','soft','middle',11);
  walkers.forEach((w,i)=>walkerFig(M(clamp(w.x,0,12)),yB,w.c||'#53D6C7',(w.ph!=null?w.ph:w.x)*2.4,w.name,o.rot,w.dim,i*15));
  if(o.rot)gC();
  if(o.clock!=null)T(x0-6,yB-78,`⏱ ${o.clock.toFixed(1)} ${o.cu||'s'}`,'q-time',o.rot?'middle':'start',15);
  if(o.tag)T(x1+3,yB-78,o.tag,'soft','end',11);
  return M;
}
function walkerFig(cx,fy,color,phase,name,rot,dim,nameLift=0){
  const sw=Math.sin(phase)*7;
  gO(dim?0.35:1);
  if(rot)gT(`rotate(${-rot} ${cx} ${fy-20})`);
  Ci(cx,fy-36,7.5,'',`fill="${color}"`);
  A(`<line x1="${cx}" y1="${(fy-28).toFixed(1)}" x2="${cx}" y2="${(fy-13).toFixed(1)}" stroke="${color}" stroke-width="5.5" stroke-linecap="round"/>`);
  A(`<line x1="${cx}" y1="${(fy-13).toFixed(1)}" x2="${(cx-sw).toFixed(1)}" y2="${fy}" stroke="${color}" stroke-width="4.5" stroke-linecap="round"/>`);
  A(`<line x1="${cx}" y1="${(fy-13).toFixed(1)}" x2="${(cx+sw).toFixed(1)}" y2="${fy}" stroke="${color}" stroke-width="4.5" stroke-linecap="round"/>`);
  if(name)T(cx,fy-49-nameLift,name,'soft','middle',10.5);
  if(rot)gC();
  gC();
}
/* chips & stamps */
function chip(x,y,txt,kind='chip',anchor='middle'){
  const w=String(txt).length*7.4+22;
  const xx=anchor==='middle'?x-w/2:anchor==='end'?x-w:x;
  Rt(xx,y-14,w,25,kind+'-bg',13);
  T(xx+w/2,y+3.5,txt,kind+'-t','middle',12.5);
}
function stamp(x,y,txt,kind='warn',rot=-7,pr=1){
  const s=pop(pr);if(pr<=0)return;
  gT(`translate(${x} ${y}) rotate(${rot}) scale(${s.toFixed(3)})`);gO(clamp(pr*2.5,0,1));
  const w=String(txt).length*13.5+34;
  Rt(-w/2,-22,w,44,`stamp-${kind}`,7);T(0,7.5,txt,`stamp-${kind}-t`,'middle',21);
  gC();gC();
}
function bigTitle(x,y,txt,sz,pr){gO(clamp(pr,0,1));T(x,y,txt,'title-big','middle',sz);gC()}

/* =========================================================

/* =========================================================
   ENGINE — one master clock, everything else derives from it
   ========================================================= */
let total=0;CHS.forEach((c,i)=>{c.i=i;c.dur=c.beats.reduce((a,b)=>a+b.d,0);c.start=total;total+=c.dur});
const st={t:0,speed:1,playing:true,ended:false};
const $=id=>document.getElementById(id);
const stage=$('stage'),capEl=$('cap'),kickEl=$('kicker'),fillEl=$('fill'),clockEl=$('clock');

function locate(t){
  let ci=CHS.findIndex(c=>t<c.start+c.dur-1e-9); if(ci<0)ci=CHS.length-1;
  let lt=t-CHS[ci].start,bi=0;
  for(const b of CHS[ci].beats){if(lt<b.d)break;lt-=b.d;bi++}
  if(bi>=CHS[ci].beats.length){bi=CHS[ci].beats.length-1;lt=CHS[ci].beats[bi].d}
  return {ci,bi,p:clamp(lt/CHS[ci].beats[bi].d,0,1)};
}
const fmtT=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;

let lastKey='',lastCh=-1;
function render(){
  const {ci,bi,p}=locate(st.t);
  S=[];
  try{CHS[ci].beats[bi].draw(p)}catch(e){S=[];T(480,270,'…','soft','middle',20);console.error(e)}
  stage.innerHTML=S.join('');
  const key=ci+'/'+bi;
  if(key!==lastKey){
    lastKey=key;
    capEl.innerHTML=CHS[ci].beats[bi].cap;
    capEl.classList.remove('swap');void capEl.offsetWidth;capEl.classList.add('swap');
  }
  if(ci!==lastCh){
    lastCh=ci;
    kickEl.innerHTML=`CHAPTER ${String(ci).padStart(2,'0')} / ${CHS.length-1} — ${CHS[ci].title.toUpperCase()} <b>· ${fmtT(CHS[ci].dur)}</b>`;
    document.querySelectorAll('.tocitem').forEach((el,i)=>{
      el.classList.toggle('active',i===ci);
      if(i===ci)el.scrollIntoView({block:'nearest'});
    });
  }
  document.querySelectorAll('.tocitem').forEach((el,i)=>{
    const c=CHS[i];
    const fr=st.ended?1:clamp((st.t-c.start)/c.dur,0,1);
    el.querySelector('.bar i').style.width=(fr*100)+'%';
    el.classList.toggle('done',fr>=0.999);
  });
  fillEl.style.width=(st.t/total*100)+'%';
  clockEl.textContent=`${fmtT(st.t)} / ${fmtT(total)}`;
  $('play').textContent = st.ended?'⟲':(st.playing?'⏸':'▶');
}

let lastFrame=performance.now();
function loop(now){
  const dt=Math.min(.1,(now-lastFrame)/1000);lastFrame=now;
  if(st.playing&&!st.ended){
    st.t+=dt*st.speed;
    if(st.t>=total){st.t=total-1e-4;st.playing=false;st.ended=true}
    render();
  }
  requestAnimationFrame(loop);
}
function seek(t,keepPlay=true){
  st.t=clamp(t,0,total-1e-4);st.ended=false;
  if(keepPlay!==null)st.playing=keepPlay?st.playing:st.playing;
  render();
}
function togglePlay(){
  if(st.ended){st.t=0;st.ended=false;st.playing=true}
  else st.playing=!st.playing;
  render();
}

/* ---------- build sidebar ---------- */
const toc=$('toc');
CHS.forEach((c,i)=>{
  const b=document.createElement('button');
  b.className='tocitem';b.setAttribute('aria-label',`Jump to chapter ${i}: ${c.title}`);
  b.innerHTML=`<span class="row"><span class="idx">${String(i).padStart(2,'0')}</span><span class="tt">${c.title}</span><span class="dur">${fmtT(c.dur)}</span></span><span class="bar"><i></i></span>`;
  b.addEventListener('click',()=>{seek(c.start);st.playing=true;st.ended=false;render();toc.classList.remove('open')});
  toc.appendChild(b);
});
$('runtime').textContent=`RUNTIME ${fmtT(total)} AT 1× · ONE FILE · OFFLINE`;

/* ---------- transport ---------- */
$('play').addEventListener('click',togglePlay);
$('prev').addEventListener('click',()=>{
  const {ci}=locate(st.t);
  const target=(st.t-CHS[ci].start>2.5||ci===0)?CHS[ci].start:CHS[ci-1].start;
  seek(target);st.playing=true;render();
});
$('next').addEventListener('click',()=>{
  const {ci}=locate(st.t);
  if(ci<CHS.length-1){seek(CHS[ci+1].start);st.playing=true;render()}
});
const prog=$('prog');
function seekFromEvent(e){
  const r=prog.getBoundingClientRect();
  const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  seek(clamp(x/r.width,0,1)*total);
}
prog.addEventListener('pointerdown',e=>{seekFromEvent(e);
  const mv=ev=>seekFromEvent(ev),up=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up)};
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);
});
CHS.forEach(c=>{if(c.i===0)return;const n=document.createElement('div');n.className='notch';n.style.left=(c.start/total*100)+'%';prog.appendChild(n)});

const spd=$('spdrange'),spdVal=$('spdval');
function setSpeed(v){st.speed=clamp(v,.2,4);spd.value=st.speed;spdVal.textContent=st.speed.toFixed(st.speed<1?2:1).replace(/0$/,'')+'×';if(st.speed>=1)spdVal.textContent=st.speed.toFixed(1)+'×'}
spd.addEventListener('input',()=>setSpeed(parseFloat(spd.value)));
document.querySelectorAll('.spdchip').forEach(b=>b.addEventListener('click',()=>setSpeed(parseFloat(b.dataset.s))));
setSpeed(1);

$('tocbtn').addEventListener('click',()=>toc.classList.toggle('open'));

window.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.code==='Space'){e.preventDefault();togglePlay()}
  else if(e.key==='ArrowRight'){$('next').click()}
  else if(e.key==='ArrowLeft'){$('prev').click()}
  else if(e.key==='ArrowUp'){e.preventDefault();setSpeed(st.speed+.25)}
  else if(e.key==='ArrowDown'){e.preventDefault();setSpeed(st.speed-.25)}
});

/* expose for internal verification */
window.__film={seek:t=>{seek(t);render()},total:()=>total,st,chapters:CHS.map(c=>({title:c.title,start:c.start,dur:c.dur}))};

render();
requestAnimationFrame(loop);
</script>
</body>
</html>
